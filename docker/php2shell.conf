# Interim hardening against php2shell (CVE-2026-109618 / CVE-2026-109619),
# per the php-src advisories GHSA-w8hw-w9fx-j79w and GHSA-6wmf-4rv5-p3rp.
# php_admin_* cannot be overridden by .htaccess or ini_set().
# Remove once the base image runs PHP >= 8.4.27.

# One request per prefork child: no state survives into the next request.
KeepAlive Off
MaxConnectionsPerChild 1
# The container memory limit is the cap instead.
php_admin_value memory_limit -1
php_admin_flag session.upload_progress.enabled off
php_admin_value max_input_nesting_level 8
