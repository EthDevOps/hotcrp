name: Docker

# Builds the image from upstream kohler/hotcrp whenever it publishes a new
# vX.Y[.Z] tag, using the Dockerfile in docker/, then creates a matching
# release on this repo.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (default: latest vX.Y[.Z])'
        required: false
      suffix:
        description: 'Rebuild: push only <version><suffix> (e.g. -php8.4.27), skip release check and creation'
        required: false

env:
  REGISTRY: docker.ethquokkaops.io
  IMAGE_NAME: ethquokkaops/ethdevops/hotcrp
  UPSTREAM: kohler/hotcrp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required for the GitHub OIDC token used to authenticate against OpenBao.
      id-token: write

    steps:
      - name: Find new upstream release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          TAG="${INPUT_TAG:-$(git ls-remote --tags --refs "https://github.com/$UPSTREAM.git" 'refs/tags/v*' \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)}"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)"
            echo "major=$(echo "$VERSION" | cut -d. -f1)"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_SUFFIX" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released, nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout build files
        if: steps.tag.outputs.new
        uses: actions/checkout@v4

      - name: Checkout upstream ${{ steps.tag.outputs.tag }}
        if: steps.tag.outputs.new
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.tag.outputs.tag }}
          path: src

      # Upstream ships no Dockerfile: ours (and its .dockerignore) go into the
      # upstream tree, which is the build context.
      - name: Add build files to upstream tree
        if: steps.tag.outputs.new
        run: cp -r docker src/docker

      - name: Set up Docker Buildx
        if: steps.tag.outputs.new
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Harbor robot credential via OpenBao (role bound to this workflow file;
      # ETH-2812 registry migration, was ghcr.io + GITHUB_TOKEN).
      - name: Fetch registry credentials from OpenBao
        if: steps.tag.outputs.new
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: https://tyrell.ethquokkaops.io
          path: jwt-github
          method: jwt
          role: ethquokkaops-hotcrp-ci
          exportEnv: true
          secrets: |
            secret/ethquokkaops/data/docker-registry/production/credentials/ethquokkaops/robot-hotcrp user | DOCKER_REGISTRY_USER ;
            secret/ethquokkaops/data/docker-registry/production/credentials/ethquokkaops/robot-hotcrp pass | DOCKER_REGISTRY_SECRET

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.tag.outputs.new
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USER }}
          password: ${{ env.DOCKER_REGISTRY_SECRET }}

      # Upstream tags are vX.Y or vX.Y.Z (not strict semver), so tags are raw.
      - name: Extract Docker metadata
        if: steps.tag.outputs.new
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}${{ inputs.suffix }},enable=${{ inputs.suffix != '' }}
            type=raw,value=latest,enable=${{ inputs.tag == '' && inputs.suffix == '' }}
            type=raw,value=${{ steps.tag.outputs.version }},enable=${{ inputs.suffix == '' }}
            type=raw,value=${{ steps.tag.outputs.minor }},enable=${{ inputs.suffix == '' && steps.tag.outputs.minor != steps.tag.outputs.version }}
            type=raw,value=${{ steps.tag.outputs.major }},enable=${{ inputs.suffix == '' }}

      - name: Build and push Docker image
        if: steps.tag.outputs.new
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: src
          file: src/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: steps.tag.outputs.new && inputs.suffix == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Upstream release: https://github.com/$UPSTREAM/releases/tag/$TAG

          Image: \`$REGISTRY/${IMAGE_NAME,,}:${TAG#v}\`"
