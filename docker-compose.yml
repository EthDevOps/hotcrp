# Local / self-hosted HotCRP stack: the application plus a MariaDB database.
#
#   docker compose up --build
#
# Then open http://localhost:8080. The first user to register becomes the
# site administrator (HotCRP's normal setup-phase behavior).

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${HOTCRP_DB_NAME:-hotcrp}
      MARIADB_USER: ${HOTCRP_DB_USER:-hotcrp}
      MARIADB_PASSWORD: ${HOTCRP_DB_PASSWORD:-hotcrp}
      MARIADB_ROOT_PASSWORD: ${HOTCRP_DB_ROOT_PASSWORD:-root}
    # HotCRP needs a large max_allowed_packet to accept paper-sized uploads.
    command: --max-allowed-packet=64M --character-set-server=utf8mb4
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/ethdevops/hotcrp:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOTCRP_DB_HOST: db
      HOTCRP_DB_NAME: ${HOTCRP_DB_NAME:-hotcrp}
      HOTCRP_DB_USER: ${HOTCRP_DB_USER:-hotcrp}
      HOTCRP_DB_PASSWORD: ${HOTCRP_DB_PASSWORD:-hotcrp}
      HOTCRP_CONF_SHORTNAME: ${HOTCRP_CONF_SHORTNAME:-HotCRP Test}
      HOTCRP_CONTACT_EMAIL: ${HOTCRP_CONTACT_EMAIL:-admin@example.com}
      # Set true when running behind a TLS-terminating proxy/ingress so HotCRP
      # trusts X-Forwarded-Proto/Port/Host and builds correct absolute URLs
      # (otherwise redirects can encode the backend port, e.g. https://host:80/).
      HOTCRP_TRUST_PROXY: ${HOTCRP_TRUST_PROXY:-false}
      # Local dev sends no real email by default. To relay through an SMTP
      # server, set HOTCRP_SMTP_HOST (and friends); email then turns on
      # automatically. HotCRP has no native SMTP — it pipes mail to a local
      # sendmail binary, which the image provides via msmtp.
      # HOTCRP_SMTP_HOST: smtp.example.com
      # HOTCRP_SMTP_PORT: "587"
      # HOTCRP_SMTP_TLS: starttls        # starttls | smtps | off
      # HOTCRP_SMTP_USER: apikey
      # HOTCRP_SMTP_PASSWORD: secret
      # HOTCRP_EMAIL_FROM: hotcrp@example.com
      HOTCRP_SEND_EMAIL: ${HOTCRP_SEND_EMAIL:-false}
    ports:
      - "${HOTCRP_PORT:-8080}:80"
    volumes:
      # Persist uploaded documents and logs across container restarts.
      - app-docs:/var/www/html/docs
      - app-logs:/var/www/html/logs

volumes:
  db-data:
  app-docs:
  app-logs:
